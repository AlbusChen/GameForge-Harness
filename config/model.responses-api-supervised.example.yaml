# Standard OpenAI API key authentication plus supervised-native engine execution.
# OPENAI_API_KEY remains in the Host HTTP transport and is not passed to shell tools.
provider: openai-responses-api
model: gpt-5.6-sol
api_key_env: OPENAI_API_KEY
execution_profile: supervised-native
reasoning_effort: medium
input_usd_per_million: 0
cached_input_usd_per_million: 0
output_usd_per_million: 0
timeout_seconds: 300
max_output_tokens: 32768
