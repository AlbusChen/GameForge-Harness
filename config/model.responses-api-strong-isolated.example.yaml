# API requests remain Host-owned; every model shell command is delegated to the
# independently configured strong-isolation runner.
provider: openai-responses-api
model: gpt-5.6-sol
api_key_env: OPENAI_API_KEY
execution_profile: strong-isolated
isolation_runner: replace-with-isolation-runner-executable
reasoning_effort: medium
input_usd_per_million: 0
cached_input_usd_per_million: 0
output_usd_per_million: 0
timeout_seconds: 300
max_output_tokens: 32768
