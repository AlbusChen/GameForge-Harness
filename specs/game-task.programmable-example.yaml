engine_profile: unity-batch-programmable-v1
entry_points:
  - Assets/Scenes/Arena.unity
target_platforms:
  - macos-standalone
requirements:
  - id: compilation
    dimension: structure
    enforcement: required
    evaluator_ref: wait_for_compilation
    model_visible: true
  - id: task-acceptance
    dimension: structure
    enforcement: required
    evaluator_ref: task_acceptance
    model_visible: false
  - id: preservation
    dimension: preservation
    enforcement: required
    evaluator_ref: preservation
    model_visible: false
evidence_policy:
  maximum_observation_bytes: 65536
  require_environment_digest: true
  require_input_trace_for_runtime_evidence: true
  conservative_invalidation: true
asset_policy:
  allow_binary_mutation: false
  require_provenance: true
  allowed_license_ids: []
  generated_roots:
    - Library
    - Temp
    - Logs
